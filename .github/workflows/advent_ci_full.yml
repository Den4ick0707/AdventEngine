name: Full CI & Release

on:
  push:
    branches: [ "main", "release/*" ]

jobs:
  build-and-package:
    name: Release Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev xorg-dev

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{matrix.build_type}}
        -S ${{github.workspace}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_type}} --parallel

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AdventEngine-${{ matrix.os }}
        path: |
          ${{github.workspace}}/build/AdventEngine
          ${{github.workspace}}/build/AdventEngine.exe
