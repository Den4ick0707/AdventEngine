name: CI

on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:
    branches: [main, dev, 'release/**']
  workflow_dispatch:

# A new push to the same branch or PR cancels the previous, now outdated run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same package list as `./dev setup --install` (minus the interactive tools).
  LINUX_PACKAGES: >-
    ninja-build pkg-config
    libwayland-dev libxkbcommon-dev wayland-protocols xorg-dev
    glslc mesa-vulkan-drivers vulkan-validationlayers xvfb
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc,   cc: gcc,   cxx: g++,     preset: ci-debug }
          - { compiler: gcc,   cc: gcc,   cxx: g++,     preset: ci-release }
          - { compiler: clang, cc: clang, cxx: clang++, preset: ci-debug }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ matrix.compiler }}-${{ matrix.preset }}

      - name: Build and unit tests
        run: ./dev test ${{ matrix.preset }}

      # Opens a real window on a virtual display and initializes Vulkan on the CPU (lavapipe).
      # Fails on any [error] line and on Vulkan validation warnings (validation is on in ci-debug).
      - name: Smoke test (sandbox)
        run: ./dev smoke ${{ matrix.preset }}

      - name: Upload smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.compiler }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/smoke.log
          if-no-files-found: ignore

  windows:
    name: Windows / MSVC / ${{ matrix.preset }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-debug, ci-release]
    env:
      CMAKE_C_COMPILER_LAUNCHER: ''
      CMAKE_CXX_COMPILER_LAUNCHER: ''
    steps:
      - uses: actions/checkout@v4

      # Puts cl.exe, the Windows SDK and Ninja on PATH for the Ninja-based presets.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # No GPU on Windows runners, so only unit tests run here.
      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }}

  lint:
    name: clang-format / clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      # No compilation here; keep ccache out of compile_commands.json for clang-tidy.
      CMAKE_C_COMPILER_LAUNCHER: ''
      CMAKE_CXX_COMPILER_LAUNCHER: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES clang-format-18 clang-tidy-18

      - name: clang-format
        run: ./dev format --check

      - name: clang-tidy
        run: ./dev tidy ci-debug

  # The only check that branch rulesets require (Settings → Rules → Rulesets, see CONTRIBUTING.md).
  # Add new jobs to `needs` and they become required automatically.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [linux, windows, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required job did not succeed"; exit 1; }
          done
