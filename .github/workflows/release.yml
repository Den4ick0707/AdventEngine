name: Release

# A version tag on main builds Release binaries and opens a draft GitHub Release.
# The whole flow (release/* branch, PR into main, tag) is described in CONTRIBUTING.md:
#   git tag -a v0.1.0 -m "AdventEngine 0.1.0" && git push origin v0.1.0
# Tags with a suffix (v0.2.0-rc.1) become pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The tag must match project(VERSION ...) in CMakeLists.txt, so binaries report the right version.
      - name: Tag matches CMake version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -nE 's/^ *VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)"
          echo "tag=$tag cmake=$version"
          [ "${tag%%-*}" = "$version" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in CMakeLists.txt"
            exit 1
          }

  build:
    name: Build / ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-24.04 }
          - { name: windows, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config \
            libwayland-dev libxkbcommon-dev wayland-protocols xorg-dev glslc

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ci-release

      - name: Build
        run: cmake --build --preset ci-release

      - name: Unit tests
        run: ctest --preset ci-release

      - name: Package
        shell: bash
        run: |
          package="AdventEngine-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$package"
          cp -r build/ci-release/bin/. "$package/"
          cp LICENSE README.md "$package/"
          cmake -E tar cf "$package.zip" --format=zip "$package"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: AdventEngine-*.zip
          if-no-files-found: error

  publish:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true

      # Notes are generated from merged PRs, grouped by labels (.github/release.yml).
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: AdventEngine ${{ github.ref_name }}
          generate_release_notes: true
          files: AdventEngine-*.zip
